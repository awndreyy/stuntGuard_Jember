name: Deploy Laravel to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout kode terbaru
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: 3. Install dependency Composer
        run: composer install --no-dev --optimize-autoloader

      - name: 4. Setup Node.js & Build Vite/Tailwind
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm run build

      - name: 5. Buat file .env production
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: 6. Upload ke server FTP (Parallel)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_SERVER }} -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            mirror -R --verbose --parallel=10 --no-perms --ignore-time \
              --exclude-glob .git* \
              --exclude-glob .git/ \
              --exclude-glob node_modules/ \
              --exclude-glob .github/ \
              --exclude-glob storage/logs/ \
              ./ ./ ;
            quit
          ""
